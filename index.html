<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Horloge Numérique</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="clock-card">
    <div id="time" class="time">00:00:00</div>
    <div id="date" class="date">jour, 1 janvier 2026</div>

    <div class="controls">
      <button id="toggle-format" class="btn">Format 12h</button>
      <button id="toggle-seconds" class="btn">Masquer secondes</button>
    </div>
  </main>

  <script src="script.js"></script>
</body>
</html>
